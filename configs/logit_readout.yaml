# The baseline: the same backbone and LoRA, reading answer-token logits from the LM head.
# Only the readout differs from decision_head.yaml.
run_name: logit_readout
model_kind: logit_readout
backbone: Qwen/Qwen3-0.6B-Base
lora_r: 16
readout_loss: restricted  # cross-entropy over the answer tokens only
label_mode: soft
shuffle_options: true
epochs: 3
batch_size: 4
grad_accum: 4
lr_backbone: 2.0e-4
comet_project: decision-model
